<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/style.css">
    <style>

        :root {
            --color-primary: #4a3c34;
            --bg-dark: #8d7560;
            --btn-color: #e4ad7d;
            --text-color: white;
            --header-bg: #4a3c34;
            --linear-bg: linear-gradient(to bottom, #0a1651, #1b1d87, #4345b4);
            --card-border: #cfae91;
        }

        .logo {
            height: 100px;
        }

        .logo-principal {
            height: 120px;
        }

        .logo-content {
            border-color: var(--card-border);
        }

        .menu-cardapio-container {
            background-image: url(src/assets/fundo-madeira.avif);
            background-repeat: no-repeat;
            background-size: cover;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 2fr));
        }

        .menu-cardapio-options {
            background-image: url(src/assets/fundo-cardapio2.png);
            background-size: cover;
            background-position: top center;
            width: 270px;
            height: 160px;
            margin: 50px auto;
            align-content: center;
            text-align: center;
        }

        .menu-cardapio-options img{
            height: 60px;
        }

        .menu-cardapio-options h3{
            color: black;
            font-family: "Pixelify sans", sans-serif;
        }

        footer {
            background-color: var(--header-bg);
        }

        .copy p{
            color: #4a3c34;
            text-shadow: none;
        }

        @media (max-width: 1135px) {
            .menu-cardapio-container {
                grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            }
        }
    </style>
    <title>Cardápio</title>
</head>
<body>
    <div class="logo-content">
        <img src="src/assets/icone-cardapio.png" alt="" class="logo">
        <img src="src/assets/logo-banchoSushi.png" alt="" class="logo-principal">
        <img src="src/assets/icone-cardapio.png" alt="Atum" class="logo">
    </div>

    <header>
        <div class="menu-hamburguer" id="menu-icone">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <nav id="nav-menu">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="cardapio.html">Cardápio</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="menu-cardapio-container">
            <article class="menu-cardapio-options">
                <img src="src/assets/peixe-cardápio.webp" alt="logo peixe cardápio">
                <h3>Peixes</h3>
            </article>

            <article class="menu-cardapio-options">
                <img src="src/assets/equipamento-cardapio.webp" alt="Logo equipamentos cardápio">
                <h3>Equipamentos</h3>
            </article>

            <article class="menu-cardapio-options">
                <img src="src/assets/ingred-cardápio.webp" alt="Logo ingredientes cardápio">
                <h3>Ingredientes</h3>
            </article>

            <article class="menu-cardapio-options">
                <img src="src/assets/prato-tubarão.webp" alt="Logo pratos cardápio">
                <h3>Pratos</h3>
            </article>
        </section>
    </main>

    <footer>
        <div class="footer-conteudo">
            <div class="footer-responssivo">
                <div class="footer-logo">
                    <img src="src/assets/logo_daveThediver.webp" alt="logo Dave" class="logo-footer">
                </div>
                <div class="footer-contato">
                    <div class="email">
                        <img src="src/assets/o-email.png" alt="email">
                        <p>banchosushi@gmail.com</p>
                    </div>
                    <div class="tel">
                        <img src="src/assets/telefone.png" alt="telefone">
                        <p>(11) 90982-2080</p>
                    </div>
                    <div class="local">
                        <img src="src/assets/localizacao.png" alt="localização">
                        <p>Rua das Profundezas, <br> 123 ilha Blue Hole, São Paulo</p>
                    </div>
                </div>
            </div>

            <div class="footer-deco">
                <em class="mkt">&#129767;Peixes, Sushis e Boas Histórias</em>
                <img src="src/assets/img-fundoFooter.png" alt="imagem restaurante">
            </div>
        </div>
        <div class="copy">
            <p>&copy; 2026 - Todos os direito reservados</p>
        </div>
    </footer>
</body>
<script src="src/js/script.js"></script>
</html>
