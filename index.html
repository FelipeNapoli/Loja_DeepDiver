<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="src/css/style.css">
    <title>Loja Dave The Diver</title>
</head>
<body>
    <div class="logo-content">
        <img src="src/assets/decoracao.png" alt="" class="logo">
        <img src="src/assets/logo_daveThediver.webp" alt="" class="logo-principal">
        <img src="src/assets/decoracao.png" alt="Atum" class="logo">
    </div>

    <header>
        <div class="menu-hamburguer" id="menu-icone">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <nav id="nav-menu">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Cardápio</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </nav>
    </header>

    <section id="banner">
        <img id="imgBanner">
    </section>

    <main class="container">
        <section class="sobre-container">
            <article class="card-sobre">
                <h2 class="titulo-sobre">Bem-Vindo ao <br> Dave The Diver Shop</h2>
                <p class="text-sobre">Encontre aqui os melhores produtos, equipamentos e sushi's relacionados ao querido megulhador <br> Dave.</p>
            </article>
        </section>

        <section class="card-container">

            <article class="card-header">

                <div class="card-header-logo">

                    <img src="src/assets/Marlin.webp" alt="foto logo seção">

                    <div class="card-header-titulo">
                        <h3>Raso</h3>
                        <p>Lançamento e Novidades</p>
                    </div>

                </div>

                <div class="card-header-deco">

                    <p>Os melhores e mais frecos pratos do <br> Bancho Sushi</p>

                    <div class="card-header-img">
                        <img src="src/assets/deco-dory.webp" alt="foto dory">
                        <img src="src/assets/deco-nemo.webp" alt="foto bancho">
                    </div>

                </div>
                
            </article>

            <div class="linha-divisao"></div>

            <article class="card">
              <svg class="borda" preserveAspectRatio="none" viewBox="0 0 400 330">

                <path d=" M18 3 H382 V6 H389 V10 H393 V15 H397 V235 H393 V240 H389 V244 H382 V247 H18 V244 H11 V240 H7 V235 H3 V15 H7 V10 H11 V6 H18 Z" 
                
                fill="#183c4f"
                stroke="#ffb347"
                stroke-width="7"
                stroke-linejoin="miter"

                />
                
                <path d=" M20 8 H380 V11 H386 V16 H390 V22 H393 V228 H390 V234 H386 V239 H380 V242 H20 V239 H14 V234 H10 V228 H7 V22 H10 V16 H14 V11 H20 Z"
                
                fill="none"
                stroke="#42c6d6"
                stroke-width="3"
                stroke-linejoin="miter"
                />
                
                <path d=" M28 12 H372 M12 28 V222 M28 238 H372"

                fill="none"
                stroke="#d96f35"
                strokke-width="1"
                />
              </svg>

            </article>

        </section>
        
    </main>
    <footer>
        <p>&copy; 2026 - Todos os direito reservados</p>
    </footer>
</body>
<script src="src/js/script.js"></script>
</html>
